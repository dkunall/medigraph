# Lowest-priority defaults shared by every MediGraph service (see PlatformDefaultsPostProcessor).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.flyway.locations=classpath:db/migration,classpath:db/platform

# probes: /actuator/health/liveness and /actuator/health/readiness (k8s-style); readiness includes the DB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,raft
management.endpoint.health.validate-group-membership=false
management.health.redis.enabled=false
management.metrics.tags.application=${spring.application.name:medigraph}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# tracing: W3C traceparent propagation + trace/span ids in the log MDC always; spans are exported only when
# management.otlp.tracing.endpoint is set (e.g. http://otel-collector:4318/v1/traces)
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

medigraph.security.jwt.issuer=medigraph-dev-issuer
medigraph.security.jwt.audience=medigraph
